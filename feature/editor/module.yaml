product:
  type: kmp/lib
  platforms: [android]
apply:
  - //compose.module-template.yaml
settings:
  android:
    namespace: com.github.yumelira.yumebox.feature.editor
dependencies:
  - //resource-symbols: compile-only
  - //core
  - //common
  - //locale
  - //ui
  - bom: $libs.editor.bom
  - $libs.rosemoe.editor
  - $libs.rosemoe.language.textmate
  # Keep TextMate highlighting on the managed Joni backend. The native backend crashes
  # inside onig_search on real subscription/JSON documents on HyperOS.
  - org.jruby.joni:joni:2.2.7
  - $libs.androidx.activity.compose
  - $libs.androidx.lifecycle.viewmodel.ktx
  - $libs.kotlinx.coroutines.android
  - $libs.koin.core
  - $libs.koin.android
  - $libs.koin.androidx.compose
  - $libs.timber
  - $libs.miuix.ui
  - $libs.miuix.preference
  - $libs.miuix.icons

  - androidx.compose.material3:material3:1.5.0-alpha22
  - androidx.compose.material:material-icons-extended

  - //ui-miuix
  - io.github.raamcosta.compose-destinations:core:2.3.0
  - androidx.navigation:navigation-compose:2.9.8
